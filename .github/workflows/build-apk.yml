name: Build Quest APK
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Smoke-test BookReader server
        run: |
          cd server
          npm install --omit=dev
          DATA_DIR=/tmp/bookreader-ci JWT_SECRET=ci-only PORT=8788 node src/server.js &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 2
          curl --fail --silent http://127.0.0.1:8788/health
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: bookreader-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
