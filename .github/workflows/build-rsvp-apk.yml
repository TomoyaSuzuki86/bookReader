name: Build RSVP Reader APK

on:
  push:
    branches: [rsvp-reader-mvp]
    paths:
      - 'rsvp-reader/**'
      - '.github/workflows/build-rsvp-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'rsvp-reader/**'
      - '.github/workflows/build-rsvp-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK
        working-directory: rsvp-reader
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: rsvp-reader-debug-apk
          path: rsvp-reader/app/build/outputs/apk/debug/app-debug.apk
