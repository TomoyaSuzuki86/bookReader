<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BookReader Upload</title><style>body{font-family:system-ui;max-width:720px;margin:40px auto;padding:20px;background:#111;color:#eee}input,button{font:inherit;padding:12px;margin:6px 0;width:100%;box-sizing:border-box}button{cursor:pointer}li{margin:10px 0}.row{display:flex;gap:10px}.row>*{flex:1}</style><body><h1>BookReader</h1><p>スマホ/PCからPDFをアップロードすると、同じアカウントでQuest 3から読めます。</p><section id="auth"><input id="email" placeholder="Email"><input id="password" type="password" placeholder="Password (6+ chars)"><div class="row"><button onclick="login(false)">Login</button><button onclick="login(true)">Create account</button></div></section><section id="library" hidden><input id="title" placeholder="Title (optional)"><input id="pdf" type="file" accept="application/pdf"><button onclick="upload()">Upload PDF</button><button onclick="loadBooks()">Refresh</button><ul id="books"></ul></section><pre id="msg"></pre><script>let token=localStorage.getItem('token');const msg=t=>document.querySelector('#msg').textContent=t;async function login(reg){const r=await fetch(reg?'/api/register':'/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});const j=await r.json();if(!r.ok)return msg(j.error);token=j.token;localStorage.setItem('token',token);show();}function show(){auth.hidden=!!token;library.hidden=!token;if(token)loadBooks()}async function loadBooks(){const r=await fetch('/api/books',{headers:{Authorization:'Bearer '+token}});if(r.status===401){localStorage.removeItem('token');token=null;return show()}const a=await r.json();books.innerHTML=a.map(b=>`<li><b>${esc(b.title)}</b><br><small>${esc(b.fileName)} / last page: ${b.lastPage+1}</small></li>`).join('')}async function upload(){const f=pdf.files[0];if(!f)return msg('PDFを選択してください');const fd=new FormData();fd.append('pdf',f);fd.append('title',title.value);const r=await fetch('/api/books',{method:'POST',headers:{Authorization:'Bearer '+token},body:fd});const j=await r.json();msg(r.ok?'Uploaded':j.error);if(r.ok){pdf.value='';title.value='';loadBooks()}}const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));show();</script></body></html>
